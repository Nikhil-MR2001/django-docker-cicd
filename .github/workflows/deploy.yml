name: Build and Push Docker Imag8e
 
on:
  push:
    branches: [ main ]
 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USRNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USRNAME }}/django-app:latest

      - name: Deploy to EC2
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USERNAME }}
            key: ${{ secrets.EC2_SSH_KEY }}
            version: 1.8.4
            script: |
              docker pull ${{ secrets.DOCKERHUB_USRNAME }}/django-app:latest
              docker stop django-container || true
              docker rm django-container || true
              docker run -d --name django-container -p 8000:8000 ${{ secrets.DOCKERHUB_USRNAME }}/django-app:latest
